<head>

<meta property="og:description" content="選一隻貓來養！餵飯、喝水、逗貓棒、讀心術，玩著玩著就學會怎麼照顧貓咪">

<body>
<title>養一隻香菇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* 一個固定的手繪房間：只做這一套配色，每個顏色都直接指定 */
  :root {
    --line: #45372C; --wall: #F3E7CF; --floor: #D9B98C; --plank: #C29C69; --sage: #A8B98A; --terra: #D98C6A;
    --mustard: #E2B95B; --fur: #9AA2AC; --white: #FCFAF4; --navy: #22305A; --pink: #EFA3A6; --paper: #FFF9EE;
    --ink: #3A2F27; --ink-soft: #7A6A5C;
    --hand: "LXGW WenKai TC", "Kaiti TC", "STKaiti", serif;
    --ui: "Noto Sans TC", -apple-system, "PingFang TC", sans-serif;
  }
  html, body { height: 100%; }
  body { margin: 0; background: #E9DCC3; color: var(--ink); font-family: var(--ui); -webkit-user-select: none; user-select: none; overflow: hidden; }
  .game { position: relative; height: 100%; max-width: 480px; margin: 0 auto; background: linear-gradient(#F3E7CF 50%, #D9B98C 50%); overflow: hidden; }
  #room { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; overflow: visible; }
  .tap { cursor: pointer; }
  .tap:hover > .hl, .tap:focus > .hl { opacity: 1; }
  .hl { opacity: 0; transition: opacity .2s; }

  /* 香菇的小動作 */
  #shroom .bob { animation: breathe 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
  #shroom.walking .bob { animation: hop .32s ease-in-out infinite; }
  #shroom .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: tail 2.8s ease-in-out infinite; }
  #shroom .lid { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); }
  #shroom.blink .lid { animation: blink .2s ease-in-out; }
  #shroom .pose { display: none; } #shroom[data-pose="sit"] .p-sit, #shroom[data-pose="loaf"] .p-loaf, #shroom[data-pose="sleep"] .p-sleep, #shroom[data-pose="eat"] .p-eat, #shroom[data-pose="crouch"] .p-loaf { display: inline; }
  #shroom[data-pose="crouch"] .bob { animation: wiggle .15s ease-in-out infinite; }
  #shroom.happy .eyes-open { display: none; } #shroom .eyes-happy { display: none; } #shroom.happy .eyes-happy { display: inline; }
  #shroom.annoyed .tail { animation: flick .28s ease-in-out 4; }
  #shroom .zzz text { animation: zz 2.4s ease-in-out infinite; } #shroom .zzz text:nth-child(2) { animation-delay: .8s; } #shroom .zzz text:nth-child(3) { animation-delay: 1.6s; }
  #shroom.eating .head-eat { animation: chew .35s ease-in-out infinite; transform-box: fill-box; transform-origin: center top; }
  @keyframes breathe { 50% { transform: scale(1.02, 1.04); } }
  @keyframes hop { 50% { transform: translateY(-5px); } }
  @keyframes tail { 50% { transform: rotate(10deg); } }
  @keyframes blink { 50% { transform: scaleY(1); } }
  @keyframes wiggle { 50% { transform: translateX(2px); } }
  @keyframes flick { 50% { transform: rotate(-26deg); } }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -16px); } }
  @keyframes chew { 50% { transform: translateY(1.5px); } }
  .heart { position: absolute; color: #E06B74; font-size: 20px; pointer-events: none; animation: floatup 1.2s ease-out forwards; z-index: 8; }
  @keyframes floatup { to { transform: translate(var(--dx, 0), -80px) scale(1.3); opacity: 0; } }
  .kib { animation: drop .5s cubic-bezier(.5,0,.8,.5) forwards; }
  @keyframes drop { from { transform: translateY(-40px); opacity: 0; } 30% { opacity: 1; } }

  /* ── 上方狀態（像貼在牆上的便條）── */
  .hud { position: absolute; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 5; display: grid; gap: 7px; pointer-events: none; }
  .note { pointer-events: auto; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 7px 10px; box-shadow: 0 3px 0 rgba(69,55,44,.18); }
  .note .row1 { display: flex; align-items: baseline; gap: 8px; }
  .note .title { font-family: var(--hand); font-weight: 700; font-size: 20px; }
  .note .day { font-family: var(--hand); font-size: 13px; color: var(--ink-soft); }
  .note .day b { color: var(--navy); font-size: 15px; }
  .sound { margin-left: auto; border: 2px solid var(--line); background: var(--wall); border-radius: 99px; width: 30px; height: 30px; font-size: 13px; cursor: pointer; }
  .bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 5px; }
  .bar .lb { display: flex; justify-content: space-between; font-family: var(--hand); font-size: 13px; }
  .bar .lb b { font-variant-numeric: tabular-nums; }
  .bar .track { height: 8px; border: 1.5px solid var(--line); border-radius: 99px; background: #F1E6D2; overflow: hidden; margin-top: 2px; }
  .bar .fill { height: 100%; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  #b-full .fill { background: var(--mustard); } #b-mood .fill { background: var(--pink); } #b-bond .fill { background: #6F86C2; }
  .meals { display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none; margin-top: 6px; font-size: 11.5px; }
  .meals em { font-style: normal; font-family: var(--hand); color: var(--ink-soft); white-space: nowrap; margin-right: 2px; }
  .meals span { padding: 1px 7px; border-radius: 99px; border: 1.5px solid #CDB89B; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meals span.done { opacity: .45; text-decoration: line-through; }
  .meals span.next { background: var(--mustard); border-color: var(--line); color: var(--ink); font-weight: 700; }

  .bubble { position: absolute; z-index: 7; max-width: 74%; word-break: keep-all; transform: translate(-50%, -100%); background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 8px 12px; font-family: var(--hand); font-size: 16px; line-height: 1.45; text-align: center; text-wrap: balance; box-shadow: 0 3px 0 rgba(69,55,44,.18); transition: opacity .25s; pointer-events: none; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; background: var(--paper); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
  .bubble small { display: block; font-family: var(--ui); font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .bubble.hide { opacity: 0; }

  /* ── 下方動作 ── */
  .dock { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .act { border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 6px 2px 5px; display: grid; justify-items: center; gap: 1px; font-family: var(--hand); font-size: 14px; color: var(--ink); box-shadow: 0 3px 0 rgba(69,55,44,.22); cursor: pointer; }
  .act:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(69,55,44,.22); }
  .act svg { width: 30px; height: 30px; }
  .act:focus-visible, .sound:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
  .act.on { background: var(--mustard); }
  .play-hud { position: absolute; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 6; display: none; gap: 8px; font-family: var(--hand); }
  .play-hud span { background: var(--navy); color: #fff; border: 2px solid var(--line); border-radius: 99px; padding: 3px 12px; font-size: 15px; }
  .playing .play-hud { display: flex; }
  .combo { position: absolute; z-index: 8; font-family: var(--hand); font-weight: 700; font-size: 24px; color: var(--navy); -webkit-text-stroke: .6px #fff; pointer-events: none; animation: pop .8s ease-out forwards; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 20% { transform: scale(1.15); opacity: 1; } 100% { transform: translateY(-36px); opacity: 0; } }
  .foot { position: absolute; left: 0; right: 0; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); text-align: center; z-index: 4; font-size: 11px; color: var(--ink-soft); pointer-events: none; }
  .foot a { pointer-events: auto; color: var(--navy); font-weight: 700; text-decoration: none; background: rgba(255,249,238,.85); padding: 2px 8px; border-radius: 99px; }
  @media (prefers-reduced-motion: reduce) { #shroom .bob, #shroom .tail, #shroom .zzz text { animation: none; } }

  /* ── v3：四條狀態、五顆按鈕、選貓與問答卡 ── */
  .bars { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #b-water .fill { background: #7FB3D5; }
  .bar .lb { font-size: 12.5px; } .bar .lb b { font-size: 11.5px; }
  .dock { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .act { font-size: 13px; } .act svg { width: 28px; height: 28px; }
  .sound + .sound { margin-left: 6px; }
  [hidden] { display: none !important; }
  .sheet { position: absolute; inset: 0; z-index: 20; background: rgba(69,55,44,.38); display: flex; align-items: flex-end; justify-content: center; padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .card { width: 100%; max-height: 92%; overflow: auto; background: var(--paper); border: 2px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 rgba(69,55,44,.25); animation: up .3s cubic-bezier(.3,.8,.3,1); }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  .card h3 { margin: 0 0 4px; font-family: var(--hand); font-size: 22px; text-wrap: balance; }
  .card .lead { margin: 0 0 12px; font-size: 13.5px; line-height: 1.6; color: var(--ink-soft); }
  .card .lead b { color: var(--ink); }
  .card h4 { margin: 14px 0 6px; font-family: var(--hand); font-size: 16px; }
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .catopt { border: 2px solid #E2D3BC; background: #FBF3E4; border-radius: 14px; padding: 4px 2px 6px; font: inherit; cursor: pointer; display: grid; justify-items: center; color: var(--ink); }
  .catopt svg { width: 70px; height: 76px; }
  .catopt b { font-family: var(--hand); font-size: 16px; } .catopt small { font-size: 10.5px; color: var(--ink-soft); line-height: 1.3; }
  .catopt.on { border-color: var(--line); background: #F6DFA6; }
  .mini .eyes-happy, .mini .lid { display: none; }
  .opts { display: grid; gap: 7px; }
  .opt { text-align: left; border: 2px solid var(--line); background: #FBF3E4; border-radius: 13px; padding: 9px 12px; font: inherit; font-size: 14.5px; color: var(--ink); cursor: pointer; box-shadow: 0 2px 0 rgba(69,55,44,.18); }
  .opt small { display: block; color: var(--ink-soft); font-size: 11.5px; margin-top: 1px; }
  .opt.on { background: #F6DFA6; } .opt.right { background: #D8E8C4; } .opt.wrong { background: #F3D0CC; }
  .opt:disabled { cursor: default; }
  .row-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .row-opts .opt { text-align: center; padding: 8px 4px; }
  .name { width: 100%; box-sizing: border-box; border: 2px solid var(--line); border-radius: 12px; padding: 9px 12px; font: inherit; font-size: 16px; background: #fff; color: var(--ink); }
  .go { margin-top: 14px; width: 100%; border: 2px solid var(--line); background: var(--mustard); border-radius: 14px; padding: 11px; font-family: var(--hand); font-size: 18px; color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 rgba(69,55,44,.25); }
  .explain { margin-top: 12px; padding: 11px 13px; border-radius: 13px; background: #EEF3E6; border: 1.5px dashed #8EA273; font-size: 13.5px; line-height: 1.65; }
  .explain b { font-family: var(--hand); font-size: 16px; display: block; margin-bottom: 2px; }
  .opt:focus-visible, .catopt:focus-visible, .go:focus-visible, .name:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
  .row1 { flex-wrap: wrap; row-gap: 4px; }
  .toast { position: absolute; left: 50%; top: calc(150px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 15; background: var(--navy); color: #fff; border: 2px solid var(--line); border-radius: 99px; padding: 6px 14px; font-family: var(--hand); font-size: 15px; white-space: nowrap; box-shadow: 0 3px 0 rgba(69,55,44,.25); animation: toast 2.8s ease forwards; pointer-events: none; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 12%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  .progress { height: 10px; border: 1.5px solid var(--line); border-radius: 99px; background: #F1E6D2; overflow: hidden; margin: 2px 0 12px; }
  .progress i { display: block; height: 100%; background: var(--mustard); }
  .kcards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .kcard { border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #FBF3E4; font-size: 12.5px; line-height: 1.55; }
  .kcard b { display: block; font-family: var(--hand); font-size: 15px; margin-bottom: 2px; }
  .kcard.locked { border-style: dashed; border-color: #CDB89B; background: transparent; color: var(--ink-soft); }
  .kcard.locked b { color: #B3A38E; }
  .reward { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: #EEF3E6; border: 2px solid #8EA273; font-size: 13.5px; line-height: 1.6; }
  .reward b { font-family: var(--hand); font-size: 17px; display: block; }
  .line-btn { display: block; width: 100%; margin-top: 10px; border: 2px solid var(--line); background: #06C755; color: #fff; border-radius: 14px; padding: 10px; font-family: var(--hand); font-size: 17px; cursor: pointer; box-shadow: 0 3px 0 rgba(69,55,44,.25); }
  .line-btn small { display: block; font-family: var(--ui); font-size: 11px; opacity: .9; }
  .ghost-btn { display: block; width: 100%; margin-top: 8px; border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 9px; font-family: var(--hand); font-size: 16px; color: var(--ink); cursor: pointer; }
  .codebox { width: 100%; box-sizing: border-box; min-height: 64px; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; font: 13px/1.5 var(--ui); background: #fff; color: var(--ink); resize: vertical; }
  .lock { position: absolute; top: 4px; right: 6px; font-size: 14px; }
  .catopt { position: relative; } .catopt.locked svg { opacity: .35; filter: grayscale(1); }
  .msg { font-size: 12.5px; margin-top: 6px; min-height: 1em; } .msg.bad { color: #B23A3A; } .msg.ok { color: #3E7A4F; }
  .ghost-btn:focus-visible, .line-btn:focus-visible, .codebox:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
</style>

<div class="game" id="game">
  <svg id="room" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid meet" aria-label="香菇的房間">
    <defs>
      <!-- 讓線條有一點點手繪的抖動 -->
      <filter id="hand" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
      <pattern id="rope" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><rect width="6" height="6" fill="#E7CF9E"/><path d="M0 3h6" stroke="#C9A86C" stroke-width="1.6"/></pattern>
      <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#6F86C2"/></pattern>
    </defs>
    <g filter="url(#hand)" stroke="#45372C" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      <!-- 牆 -->
      <rect x="-200" y="-400" width="800" height="630" fill="#F3E7CF"/>
      <path d="M-200 230 H600" stroke-width="3"/>
      <rect x="-200" y="214" width="800" height="16" fill="#C9A67A"/>
      <!-- 窗戶 -->
      <rect x="226" y="80" width="138" height="100" rx="4" fill="#C6DDE0"/>
      <path d="M295 80 V180 M226 130 H364" />
      <path d="M232 168 Q260 150 290 166" fill="none" stroke="#9DBA8E" stroke-width="2"/>
      <path d="M302 126 Q330 106 356 122" fill="none" stroke="#9DBA8E" stroke-width="2"/>
      <rect x="218" y="176" width="154" height="10" rx="3" fill="#B98A5E"/>
      <!-- 窗台上的小盆栽 -->
      <path d="M332 176 L336 160 H356 L360 176 Z" fill="#D98C6A"/>
      <path d="M346 160 C340 146 334 140 330 132 M346 160 C350 146 358 140 364 136 M346 160 V138" fill="none" stroke="#6E8F5A"/>
      <!-- 牆上掛的香菇照片 -->
      <rect x="150" y="96" width="50" height="58" rx="3" fill="#B98A5E"/>
      <rect x="157" y="103" width="36" height="44" fill="#E8D9BE"/>
      <g id="photo" stroke-width="1.6"><circle cx="175" cy="122" r="10" fill="#9AA2AC"/><path d="M168 114 l-2 -7 6 4 M182 114 l2 -7 -6 4" fill="#9AA2AC"/><path d="M175 117 c-3 4 -5 6 -7 8 c2 4 12 4 14 0 c-2 -2 -4 -4 -7 -8z" fill="#FCFAF4" stroke-width="1"/><path d="M167 134 q8 6 16 0 l-2 6 q-6 4 -12 0z" fill="#22305A" stroke-width="1"/></g>
      <!-- 地板 -->
      <rect x="-200" y="230" width="800" height="600" fill="#D9B98C"/>
      <g stroke="#C29C69" stroke-width="2" fill="none"><path d="M-20 300 H420 M-20 380 H420 M-20 470 H420 M-20 560 H420"/><path d="M90 230 V300 M260 300 V380 M140 380 V470 M320 470 V560 M60 560 V640 M340 230 V300 M30 300 V380 M400 380 V470"/></g>

      <!-- 貓跳台（點了香菇會爬上去睡）-->
      <g class="tap" id="t-tree" tabindex="0" role="button" aria-label="貓跳台">
        <ellipse class="hl" cx="78" cy="196" rx="54" ry="18" fill="#FFF1C9" stroke="none"/>
        <rect x="64" y="200" width="22" height="210" fill="url(#rope)"/>
        <rect x="24" y="392" width="112" height="22" rx="6" fill="#9C6B43"/>
        <rect x="30" y="292" width="96" height="18" rx="6" fill="#B98A5E"/>
        <rect x="20" y="182" width="116" height="20" rx="7" fill="#B98A5E"/>
        <rect x="88" y="236" width="56" height="50" rx="8" fill="#9C6B43"/><ellipse cx="116" cy="262" rx="14" ry="13" fill="#5E4230"/>
        <rect x="102" y="306" width="18" height="90" fill="url(#rope)"/>
      </g>
      <!-- 圓形地毯 -->
      <ellipse cx="206" cy="458" rx="122" ry="54" fill="#A8B98A"/>
      <ellipse cx="206" cy="458" rx="104" ry="42" fill="none" stroke="#8EA273" stroke-width="2"/>
      <!-- 窩（點了香菇會去睡）-->
      <g class="tap" id="t-bed" tabindex="0" role="button" aria-label="香菇的窩">
        <ellipse class="hl" cx="328" cy="330" rx="60" ry="30" fill="#FFF1C9" stroke="none"/>
        <ellipse cx="328" cy="336" rx="56" ry="28" fill="#D98C6A"/>
        <ellipse cx="328" cy="330" rx="40" ry="17" fill="#F2C9A8"/>
      </g>
      <!-- 碗（點了餵飯）-->
      <g class="tap" id="t-bowl" tabindex="0" role="button" aria-label="飯碗">
        <ellipse class="hl" cx="300" cy="558" rx="34" ry="18" fill="#FFF1C9" stroke="none"/>
        <path d="M282 552 Q300 584 318 552 Z" fill="#F4C6C2"/><ellipse cx="300" cy="552" rx="18" ry="6" fill="#FBE3DF"/>
        <ellipse id="food" cx="300" cy="551" rx="13" ry="3.5" fill="#B9762D" stroke-width="1.2" opacity="0"/>
        <g id="kibbles"></g>
      </g>
      <!-- 水碗（和飯碗分開放）-->
      <g class="tap" id="t-water" tabindex="0" role="button" aria-label="水碗">
        <ellipse class="hl" cx="214" cy="344" rx="34" ry="18" fill="#FFF1C9" stroke="none"/>
        <path d="M196 340 Q214 372 232 340 Z" fill="#BCD3E3"/><ellipse cx="214" cy="340" rx="18" ry="6" fill="#DDEBF4"/>
        <ellipse id="waterSurf" cx="214" cy="340" rx="13" ry="3.5" fill="#8FC1E0" stroke="none"/>
      </g>
      <!-- 玩具：羽毛逗貓棒（點了開始玩）-->
      <g class="tap" id="t-toy" tabindex="0" role="button" aria-label="逗貓棒">
        <ellipse class="hl" cx="106" cy="546" rx="44" ry="18" fill="#FFF1C9" stroke="none"/>

    if (忙 || 遊戲中) return;
    忙 = true;
    走到(地點.water, () => {
      姿勢('eat'); 香菇.classList.add('eating');
      setTimeout(() => {
        香菇.classList.remove('eating'); 姿勢('sit');
        狀態.水 += 30; 狀態.心情 = Math.min(100, 狀態.心情 + 2); 存(); 畫(); 忙 = false;
        const 目標 = 喝水目標();
        if (狀態.水 >= 目標 && 狀態.水 - 30 < 目標) { 愛心(3); 說('今天的水喝夠了！', `${名()}大約 ${作息().公斤} 公斤，一天約 ${目標}ml ~ 每公斤體重約 40～60ml（食物裡的水也算）`, 6); }
        else 說(`咕嚕咕嚕… +30ml`, `今天 ${狀態.水}/${目標}ml ・ ${喝水小知識[喝次++ % 喝水小知識.length]}`, 4.6);
        解鎖('水碗'); if (狀態.水 >= 目標) 解鎖('喝水量');
      }, 2000);
    });
  }

  // ── 摸摸 ──
  let 摸數 = 0, 上次摸 = 0, 摸計時;
  function 摸() {
    if (遊戲中 || 忙) return;
    const now = Date.now(); if (now - 上次摸 < 240) return; 上次摸 = now; 摸數++;
    clearTimeout(摸計時); 摸計時 = setTimeout(() => { 摸數 = 0; 香菇.classList.remove('happy'); }, 2200);
    if (香菇.dataset.pose === 'sleep') { 姿勢('loaf'); 說(`嗯…？${我()}在睡覺…`, '', 2); return; }
    if (摸數 > 12) { 香菇.classList.remove('happy'); 香菇.classList.add('annoyed'); setTimeout(() => 香菇.classList.remove('annoyed'), 1200); 說(`好了好了，${我()}知道你愛我`, '尾巴開始甩就是「摸夠了」~ 讓牠休息一下'); 摸數 = 0; 解鎖('摸夠了'); return; }
    香菇.classList.add('happy'); if (摸數 % 3 === 1) { 愛心(1); 呼嚕(); }
    if (摸數 === 5) { 說('呼嚕呼嚕…', '眼睛瞇起來，代表牠很放鬆', 2.4); 解鎖('瞇眼'); }
    狀態.心情 = Math.min(100, 狀態.心情 + 1.3); 狀態.親密 = Math.min(100, 狀態.親密 + .7); 存(); 畫();
  }
  let 按著 = false;
  香菇.addEventListener('pointerdown', e => { 按著 = true; 摸(); e.stopPropagation(); });
  svg.addEventListener('pointermove', e => { if (按著 && !遊戲中) { const p = 到房間(e.clientX, e.clientY); if (Math.hypot(p.x - 位置[0], p.y - 位置[1] + 25) < 40) 摸(); } });
  addEventListener('pointerup', () => 按著 = false);
  $('pet').onclick = () => { if (忙 || 遊戲中) return; 走到(地點.rug, () => { 姿勢('sit'); 說(`在${名()}身上慢慢摸`, '手指按著貓咪來回滑 ~ 從頭頂往背後順著摸', 3); }); };

  // ── 睡午覺（點窩或貓跳台）──
  function 睡午覺(去樹上) {
    if (忙 || 遊戲中) return;
    走到(去樹上 ? 地點.tree : 地點.bed, () => { 姿勢('sleep'); 狀態.心情 = Math.min(100, 狀態.心情 + 5); 存(); 畫(); 說('zzz…', `貓咪一天要睡 12～16 小時 ~ ${去樹上 ? '高處讓牠覺得安全' : '有自己的窩牠才睡得安穩'}`, 3.6); 解鎖('睡覺'); });
  }

  // ── 讀心術：看貓咪的動作，猜牠在想什麼 ──
  const 情境們 = [
    { 地: 'rug', 姿: 'sit', 效果: 'blink', 景: '慢慢地對你眨眼睛', 對: '我好喜歡你、很信任你', 錯: ['我想睡覺了', '我在生你的氣'], 解: '慢慢眨眼是貓咪的「親親」，代表牠很放鬆、很信任你。你也可以對牠慢慢眨回去' },
    { 地: 'rug', 姿: 'sit', 效果: 'annoyed', 景: '被摸的時候，尾巴開始用力甩', 對: '有點煩了，先別摸', 錯: ['好開心，再多摸一點', '想跟你玩'], 解: '貓咪甩尾巴跟狗狗搖尾巴意思不一樣！用力甩通常是不耐煩，先停手讓牠休息' },
    { 地: 'rug', 姿: 'loaf', 景: '把腳腳全部收起來，趴成一條吐司', 對: '很放鬆，在這裡休息一下', 錯: ['想出門玩', '很害怕'], 解: '吐司姿勢代表牠覺得這裡很安全，但又可以隨時起身' },
    { 地: 'bowl', 姿: 'sit', 景: '一直坐在飯碗旁邊，對著你喵喵叫', 對: '該開飯了吧', 錯: ['碗太醜了', '想睡覺'], 解: '貓咪很會記時間！固定時間開飯，牠就不會一直討食' },
    { 地: 'rug', 姿: 'crouch', 景: '身體壓低、屁股左右扭來扭去', 對: '準備撲過去抓獵物', 錯: ['屁股癢', '想上廁所'], 解: '扭屁股是在調整後腳、準備起跳。這時候拿逗貓棒陪牠玩剛剛好' },
    { 地: 'window', 姿: 'sit', 景: '盯著窗外的小鳥，嘴巴發出「喀喀喀」的聲音', 對: '好想抓那隻鳥', 錯: ['在跟你聊天', '在唱歌'], 解: '這叫「喀喀叫」，是看到獵物卻抓不到時的興奮反應，很常見' },
    { 地: 'bed', 姿: 'sleep', 景: '捲成一團、尾巴蓋住鼻子睡覺', 對: '想保暖，窩得很有安全感', 錯: ['在生你的氣', '肚子餓了'], 解: '捲成一團可以保留體溫。給牠一個柔軟、有包覆感的窩，牠會睡得很安穩' },
    { 地: 'rug', 姿: 'sit', 景: '你叫牠的名字，牠沒回頭，只有耳朵轉過來', 對: '有聽到啦，只是懶得動', 錯: ['聽不懂自己的名字', '耳朵在癢'], 解: '貓咪其實認得自己的名字！耳朵轉過來就是有在聽，只是個性比較酷' },
    { 地: 'water', 姿: 'sit', 景: '用前腳撥水碗裡的水，再舔腳上的水', 對: '在研究這碗水，好玩又好奇', 錯: ['水太多了要倒掉', '在洗手'], 解: '有些貓咪喜歡會動的水，撥水是好奇也是在確認水面。可以試試多放一個水碗或流動的水' },
  ];
  情境們.forEach((q, i) => { 知識卡.find(k => k.id === '心' + i).文 = q.解; });
  let 出題序 = [], 效果計時;
  function 讀心術() {
    if (忙 || 遊戲中) return;
    if (!出題序.length) 出題序 = 情境們.map((_, i) => i).sort(() => Math.random() - .5);
    const 題號 = 出題序.pop(), q = 情境們[題號];
    忙 = true;
    走到(地點[q.地], () => {
      姿勢(q.姿); clearInterval(效果計時);
      if (q.效果 === 'blink') 效果計時 = setInterval(() => { 香菇.classList.add('happy'); setTimeout(() => 香菇.classList.remove('happy'), 900); }, 1800);
      if (q.效果 === 'annoyed') 效果計時 = setInterval(() => { 香菇.classList.remove('annoyed'); void 香菇.getBBox(); 香菇.classList.add('annoyed'); }, 1400);
      const 選項 = [q.對, ...q.錯].sort(() => Math.random() - .5);
      開卡(`<h3>💭 ${名()}在想什麼？</h3><p class="lead">${名()}<b>${q.景}</b></p>
        <div class="opts">${選項.map(o => `<button class="opt" data-o="${o}">${o}</button>`).join('')}</div><div id="ans"></div>`);
      document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
        const 中 = b.dataset.o === q.對;
        document.querySelectorAll('[data-o]').forEach(x => { x.disabled = true; if (x.dataset.o === q.對) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
        if (中) { 狀態.親密 = Math.min(100, 狀態.親密 + 2); 狀態.心情 = Math.min(100, 狀態.心情 + 3); 狀態.答對 = (狀態.答對 || 0) + 1; 存(); 畫(); }
        $('ans').innerHTML = `<div class="explain"><b>${中 ? '答對了！親密 +2' : '其實牠在想：' + q.對}</b>${q.解}</div><button class="go" id="okBtn">${中 ? '我懂牠了' : '原來如此'}</button>`;
        $('okBtn').onclick = () => { 關卡(); clearInterval(效果計時); 香菇.classList.remove('happy', 'annoyed'); 忙 = false; 說(`💭 ${q.對}`, `你已經讀懂${名()} ${狀態.答對 || 0} 次`, 3.2); 解鎖('心' + 題號); };
      });
    });
  }

  // ── 逗貓棒：在牠面前慢慢晃，蹲低後撲 ──
  let 撲中 = 0, 剩 = 30, 手 = { x: 300, y: 400 }, 上一手 = { ...手 }, 停留 = 0, 冷卻 = 0, 計時器, 迴圈;
  function 開始玩() {
    if (遊戲中 || 忙) return;
    走到(地點.rug, () => {
      遊戲中 = true; 撲中 = 0; 剩 = 30; 遊戲.classList.add('playing'); $('play').classList.add('on'); 姿勢('sit');
      $('wand').style.display = ''; $('caught').textContent = 0; $('timeLeft').textContent = 剩; 手 = { x: 300, y: 380 }; 上一手 = { ...手 }; 畫棒();
      說('用手指拖著羽毛', `在${名()}面前慢慢晃，牠會蹲低準備撲`, 3.2);
      計時器 = setInterval(() => { 剩--; $('timeLeft').textContent = 剩; if (剩 <= 0) 結束玩(); }, 1000);
      迴圈 = requestAnimationFrame(遊戲迴圈);
    });
  }
  svg.addEventListener('pointermove', e => { if (!遊戲中) return; const p = 到房間(e.clientX, e.clientY); 手 = { x: p.x, y: Math.max(240, p.y) }; });
  svg.addEventListener('pointerdown', e => { if (!遊戲中) return; const p = 到房間(e.clientX, e.clientY); 手 = { x: p.x, y: Math.max(240, p.y) }; });
  function 畫棒() { $('wandLine').setAttribute('x2', 手.x); $('wandLine').setAttribute('y2', 手.y - 26); $('feather').setAttribute('transform', `translate(${手.x} ${手.y}) rotate(${Math.sin(Date.now() / 110) * 12})`); }
  function 遊戲迴圈() {
    if (!遊戲中) return;
    const 頭 = { x: 位置[0], y: 位置[1] - 40 * 比例(位置[1]) };
    const 距 = Math.hypot(手.x - 頭.x, 手.y - 頭.y), 速 = Math.hypot(手.x - 上一手.x, 手.y - 上一手.y); 上一手 = { ...手 };
    const 看 = Math.max(-1, Math.min(1, (手.x - 頭.x) / 80));
    香菇.querySelectorAll('.pup').forEach((p, i) => p.setAttribute('cx', (i % 2 ? 9 : -9) + 看 * 1.8));
    if (performance.now() > 冷卻) {
      if (距 < 110 && 速 < 6) { 停留++; if (停留 > 14) 姿勢('crouch'); } else { 停留 = Math.max(0, 停留 - 2); if (停留 < 6 && 香菇.dataset.pose === 'crouch') 姿勢('sit'); }
      if (停留 > 44) 撲(距 < 95);
    }
    畫棒(); 迴圈 = requestAnimationFrame(遊戲迴圈);
  }
  function 撲(瞄準) {
    停留 = 0; 冷卻 = performance.now() + 1200; 姿勢('sit');
    const 起 = [...位置], 目 = [Math.max(40, Math.min(360, 手.x)), Math.max(300, Math.min(600, 手.y + 30))], t0 = performance.now();
    (function 跳(t) {
      const k = Math.min(1, (t - t0) / 420), 高 = Math.sin(Math.PI * k) * 46;
      放(起[0] + (目[0] - 起[0]) * k, 起[1] + (目[1] - 起[1]) * k - 高);
      if (k < 1) return requestAnimationFrame(跳);
      const 中 = 瞄準 && Math.hypot(手.x - 目[0], 手.y + 30 - 目[1]) < 60;
      const p = 到螢幕(手.x, 手.y - 30), c = document.createElement('div'); c.className = 'combo'; c.style.left = (p.x - 34) + 'px'; c.style.top = p.y + 'px';
      if (中) { 撲中++; $('caught').textContent = 撲中; c.textContent = 撲中 > 1 ? `抓到 ×${撲中}` : '抓到！'; 狀態.心情 = Math.min(100, 狀態.心情 + 4); 狀態.親密 += .8; 愛心(2); }
      else { c.textContent = '差一點！'; c.style.color = '#7A6A5C'; }
      遊戲.append(c); setTimeout(() => c.remove(), 900); 畫(); 存();
    })(t0);
  }
  function 結束玩() {
    遊戲中 = false; clearInterval(計時器); cancelAnimationFrame(迴圈);
    遊戲.classList.remove('playing'); $('play').classList.remove('on'); $('wand').style.display = 'none'; 姿勢('loaf');
    狀態.飽足 = Math.max(0, 狀態.飽足 - 6); 存(); 畫();
    if (撲中 > 0) setTimeout(() => 解鎖('狩獵'), 600);
    說(撲中 >= 6 ? `${我()}今天狀態超好！` : 撲中 >= 3 ? `還算盡興，明天再陪${我()}玩` : `${我()}今天沒什麼興致…`, `撲中 ${撲中} 次 ~ 每天 2～3 次狩獵遊戲，室內貓才有運動`, 5.5);
  }

  // 房間裡的東西都可以點
  $('t-bowl').onclick = 餵飯; $('feed').onclick = 餵飯;
  $('t-water').onclick = 喝水; $('drink').onclick = 喝水;
  $('t-toy').onclick = 開始玩; $('play').onclick = () => 遊戲中 ? 結束玩() : 開始玩();
  $('t-bed').onclick = () => 睡午覺(false); $('t-tree').onclick = () => 睡午覺(true);
  $('mind').onclick = 讀心術;
  for (const id of ['t-bowl', 't-water', 't-toy', 't-bed', 't-tree']) $(id).addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $(id).onclick(); } });

  // ── 開始 ──
  狀態 = 讀(); 放(...地點.rug); 姿勢('loaf');
  addEventListener('resize', 對話位置);
  if (!狀態.貓) { 狀態.貓 = { 種: '香菇', 段: '熟齡', 名: '香菇' }; 套貓(); 選貓畫面(true); }
  else {
    套貓();
    setTimeout(() => {
      if (狀態.首次) { 狀態.首次 = false; 存(); 說(狀態.連續 > 1 ? `你回來啦～連續第 ${狀態.連續} 天了` : `你回來啦～${我()}等你好久了`, 狀態.飽足 < 40 ? `${名()}有點餓了 ~ 點飯碗餵牠` : '點房間裡的東西，照顧牠吧', 6.5); }
      else 說(狀態.飽足 < 40 ? `${我()}有點餓…` : '喵～', 狀態.飽足 < 40 ? '點飯碗餵飯' : '', 3);
    }, 400);
  }
  setInterval(() => { 狀態.飽足 = Math.max(5, 狀態.飽足 - .17); 狀態.心情 = Math.max(10, 狀態.心情 - .11); 存(); 畫(); }, 60000);
})();
</script>
